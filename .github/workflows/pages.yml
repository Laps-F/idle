# Encantados - publicação no GitHub Pages
#
# O que faz: a cada envio para o ramo main, roda os testes, gera o build e
# publica a pasta dist em https://laps-f.github.io/idle/. Se um teste falhar,
# nada é publicado e o site continua na versão anterior.
#
# Também dá para rodar à mão: aba Actions do repositório, "Publicar no GitHub
# Pages", botão "Run workflow".

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um envio novo cancela a publicação que ainda estiver na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Testar e gerar o build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
